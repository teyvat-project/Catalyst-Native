plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.natsuneko.catalyst.restorecredential'
version = '1.0.0'

android {
  namespace "com.natsuneko.catalyst.restorecredential"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  implementation "androidx.credentials:credentials:1.5.0"
  implementation "androidx.credentials:credentials-play-services-auth:1.5.0"
}
