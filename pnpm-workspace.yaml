# monorepo
packages:
  - apps/*
  - packages/*

# package resolution
nodeLinker: isolated
patchedDependencies:
  "@likashefqet/react-native-image-zoom": patches/@likashefqet__react-native-image-zoom.patch
  react-native-image-crop-picker@0.51.1: patches/react-native-image-crop-picker@0.51.1.patch
  react-native-config@1.7.2: patches/react-native-config@1.7.2.patch
  expo-modules-core@58.0.23: patches/expo-modules-core@58.0.23.patch

# @react-native/jest-preset は require.resolve("react-native") するが依存に宣言していないため、
# isolated リンカーだと別アプリ (apps/macos 等) の react-native が解決されてしまう
packageExtensions:
  "@react-native/jest-preset":
    peerDependencies:
      react-native: "*"

# catalog
catalog:
  "@natsuneko-laboratory/catalyst-sdk": 2026.10.27-beta.1
  "@natsuneko-laboratory/fleet-renderer-core": 0.2.0
  "@natsuneko-laboratory/fleet-renderer-react-native": 0.1.0
  "@natsuneko-laboratory/memora": 0.3.0
  "@natsuneko-laboratory/react-native-credential-store": 0.1.0-alpha.3
  "@natsuneko-laboratory/react-native-desktop-navigation": 0.1.0-alpha.20
  "@natsuneko-laboratory/react-native-desktop-window-size": 0.1.2
  "@natsuneko-laboratory/react-native-emoji-verse": 0.1.0
  "@natsuneko-laboratory/react-native-twitter-text": 0.1.0
  "@natsuneko-laboratory/react-native-webcrypto-digest": 0.2.0
  clsx: 2.1.1
  cn: 0.2.6
  tailwind-merge: 3.6.0
  tailwindcss: 4.3.3
  uniwind: 1.13.0

# security
allowBuilds:
  "@firebase/util": false
  "@parcel/watcher": false
  "@sentry/cli": true
  core-js: false
  dtrace-provider: false
  esbuild: false
  msgpackr-extract: false
  protobufjs: false
  unrs-resolver: true

minimumReleaseAge: 4320
minimumReleaseAgeExclude:
  - "@natsuneko-laboratory/catalyst-sdk"
  - "@natsuneko-laboratory/fleet-renderer-core"
  - "@natsuneko-laboratory/fleet-renderer-react-native"
  - "@natsuneko-laboratory/memora"
  - "@natsuneko-laboratory/react-native-credential-store"
  - "@natsuneko-laboratory/react-native-desktop-navigation"
  - "@natsuneko-laboratory/react-native-desktop-window-size"
  - "@natsuneko-laboratory/react-native-emoji-verse"
  - "@natsuneko-laboratory/react-native-twitter-text"
  - "@natsuneko-laboratory/react-native-webcrypto-digest"
  - "@expo/cli@58.1.13"
  - "@expo/metro-config@58.0.15"
  - "@expo/modules-macros-linux-arm64@0.21.0"
  - "@expo/modules-macros-linux-x64@0.21.0"
  - "@expo/modules-macros-win32-arm64@0.21.0"
  - "@expo/modules-macros-win32-x64@0.21.0"
  - "@expo/router-server@58.0.15"
  - "@expo/schema-utils@58.0.2"
  - "@noxcturnal/noxcturnal-darwin-arm64@0.1.4"
  - "@noxcturnal/noxcturnal-darwin-x64@0.1.4"
